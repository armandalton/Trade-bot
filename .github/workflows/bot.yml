name: XT SMA64 Signal Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = code tests, check = XT+Telegram connection, train = 6-month training/backtest/report, scan = one live scan, live = minute-by-minute loop (~5h)"
        required: true
        default: "check"
        type: choice
        options:
          - selftest
          - check
          - train
          - scan
          - live
  schedule:
    - cron: "*/10 * * * *"   # live scan with catch-up (GitHub may delay or skip runs)
    - cron: "17 0 * * 0"     # weekly retrain + report (Sunday 00:17 UTC)

permissions:
  contents: write

concurrency:
  group: xt-sma64-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Select mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE" = "17 0 * * 0" ]; then echo "mode=train" >> "$GITHUB_OUTPUT"; else echo "mode=scan" >> "$GITHUB_OUTPUT"; fi
          else
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: "btc_usdt,eth_usdt,sol_usdt,bnb_usdt,xrp_usdt"
          PAPER_CAPITAL: "2000"
          RISK_PCT: "0.005"
          DAILY_LOSS_PCT: "0.015"
          MAX_DRAWDOWN_PCT: "0.06"
          MODE: ${{ steps.mode.outputs.mode }}
        run: python bot.py "$MODE"
      - name: Save bot state, model and report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update bot state/model/report"
            for i in 1 2 3; do
              git pull --rebase -q && git push -q && break
              sleep 5
            done
          fi
