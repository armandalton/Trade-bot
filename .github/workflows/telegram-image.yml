
name: Telegram Image Bot

on:
  workflow_dispatch:
    inputs:
      update_id:
        description: "Telegram update ID"
        required: false
        type: string

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

jobs:
  telegram-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'opencv-python-headless>=4.9,<5' 'Pillow>=10,<13'

      - name: Run Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py image-bot

      - name: Save Telegram offset
        run: |
          if [ -f telegram_image_offset.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add telegram_image_offset.json
            git diff --cached --quiet || git commit -m "Update Telegram image offset"
            git push
          fi
