
name: Telegram Live Webhook Bot

on:
  workflow_dispatch:
    inputs:
      update_json:
        description: "Telegram update payload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'opencv-python-headless>=4.9,<5' 'Pillow>=10,<13'

      - name: Process Telegram update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_UPDATE_JSON: ${{ inputs.update_json }}
        run: python bot.py webhook
